# =============================================================================
# PromptDev — Podman / Docker Compose
# =============================================================================
# Runs the full stack: PostgreSQL, Frontend (Next.js with integrated backend),
# and optionally Slack Bot.
#
# Quick deploy:   curl -fsSL <raw-url>/deploy.sh | bash
#
# Podman (preferred):
#   podman-compose up -d                     # Core services
#   podman-compose --profile slack up -d     # Include Slack bot
#
# Docker (alternative):
#   docker compose up -d                  # Core services
#   docker compose --profile slack up -d  # Include Slack bot
#
# Environment:
#   Copy .env.example → .env and fill in your secrets before starting.
#
# Volumes (persistent data):
#   pgdata         – PostgreSQL database files
#   nextjs-cache   – Next.js ISR / component cache (survives restarts)
#   workspace-data – Workspace files (task repos, generated code)
# =============================================================================

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    container_name: promptdev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: promptdev
      POSTGRES_USER: promptdev
      POSTGRES_PASSWORD: promptdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptdev -d promptdev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Next.js Frontend (with integrated backend) ────────────────────────────
  frontend:
    build:
      context: ./promptdev-frontend
      dockerfile: Dockerfile
    container_name: promptdev-frontend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://promptdev:promptdev@db:5432/promptdev
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BITBUCKET_URL: ${BITBUCKET_URL:-}
      BITBUCKET_USERNAME: ${BITBUCKET_USERNAME:-}
      BITBUCKET_TOKEN: ${BITBUCKET_TOKEN:-}
      JIRA_URL: ${JIRA_URL:-}
      JIRA_USERNAME: ${JIRA_USERNAME:-}
      JIRA_TOKEN: ${JIRA_TOKEN:-}
      WORKSPACE_BASE_PATH: /data/workspaces
    ports:
      - "3000:3000"
    volumes:
      - nextjs-cache:/app/.next/cache
      - workspace-data:/data/workspaces
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Slack Bot (optional — start with --profile slack) ──────────────────────
  bot:
    build:
      context: ./promptdev-bot
      dockerfile: Dockerfile
    container_name: promptdev-bot
    restart: unless-stopped
    profiles:
      - slack
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      PROMPTDEV_API_URL: http://frontend:3000/api
      PROMPTDEV_FRONTEND_URL: http://frontend:3000

volumes:
  pgdata:
  nextjs-cache:
  workspace-data:

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

logging:
  level:
    root: WARN
    com.promptdev: DEBUG

# Test encryption key (32+ bytes required)
promptdev:
  encryption:
    key: TestEncryptionKeyForUnitTests32!

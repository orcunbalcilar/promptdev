spring:
  application:
    name: promptdev-backend

  # ─── Database ────────────────────────────────────────────────────────────────
  # All connection properties are REQUIRED via environment variables.
  # No defaults are shipped — start-all.sh / docker-compose.yml inject them.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate} # use 'validate' in production to avoid accidental schema changes
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging — override with LOG_LEVEL env var for verbose output
logging:
  level:
    root: INFO
    com.promptdev: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Bitbucket (per-user settings stored in a database, these are optional global fallbacks)
bitbucket:
  base-url: ${BITBUCKET_URL:}
  project-key: ${BITBUCKET_PROJECT_KEY:}
  username: ${BITBUCKET_USERNAME:}
  password: ${BITBUCKET_PASSWORD:}
  token: ${BITBUCKET_TOKEN:}

# Jira Server (optional — per-user settings stored in a database, global fallback)
jira:
  base-url: ${JIRA_URL:}
  username: ${JIRA_USERNAME:}
  password: ${JIRA_PASSWORD:}
  token: ${JIRA_TOKEN:}

# SSE & encryption
promptdev:
  sse:
    timeout: 30000
    heartbeat-interval: 15000
  encryption:
    key: ${ENCRYPTION_KEY:}
  workspace:
    base-path: ${WORKSPACE_BASE_PATH:${java.io.tmpdir}/promptdev-workspaces}
    max-size-mb: ${WORKSPACE_MAX_SIZE_MB:500}
